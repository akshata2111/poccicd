# This is a basic workflow to help you get started with Actions

name: poc

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - name: Cache
        uses: actions/checkout@v2.1.5
        with:
      # A list of files
           path: /home/runner/.m2/repository
           key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
           restore-keys:
                ${{ runner.os }}-maven-
        - name: Setup Java JDK
          uses: action/setup-java@v1
          with:
      #The java version to set
             java-version:1.8
             

      # Runs a single commands using the runners shell
      - name: Build
        run: mvn -B package --file pom.xml
        

      # Runs a set commands using the runners shell
      - name: Artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse -short "$GITHUB_SHA")
          artifactName2=$(ls target/*.jar | head -1 | sed "s/.jar/.$comitHash.jar/g")
          mv $artifactName1 $artifactName2

      - name: Upload a Build artifact
        uses: actions/upload-artifact@master
        with:
          #Artifact name
          name: build_artifact
          # A file directory
          path: target/*.jar
deploy:
  needs: build
  #the type of runner
  runs-on: ubantu-latest

#steps reprsent sequence of tasks
steps:
  #Chekout repo
  -uses: action/checkout@v2
  -name: Cache
   uses: action/cache@v2.1.5
   with:
# A list of file
     path: /home/runner/.m2/repository
     key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
     restore-keys: |
        ${{ runner.os }}-maven-
 -name: Setup Java JDK
  uses: action/setup-java@v1
  with:
#to java version to setup
    java-version: 1.8
 -name: Sownload a Build Artifact
  uses: action/download-artifact@master
  with:
  #Artifact name
  name: build_artifact

-name: Deploy to Cloudhub.
 env:
   USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
   PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}

run:
  artifactName=$(ls *.jar | head -1)
  mvn mule:deploy -Dmule.artifact=$artifactName -Danypoint.userName=$USERNAME -Danypoint.password=$PASSWORD -Danypoint.env=Sandbox -Danypont.appName=poccicd-ApplicationWorkFlow


  
        
       
   
   
  
          
          
          
          
          

          
          
